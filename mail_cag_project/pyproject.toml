[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-cag"
version = "0.1.0"
description = "Cyclic adversarial game experiments for robust email threat detection"
requires-python = ">=3.12"
dependencies = [
  "pyyaml",
  "pandas",
  "langdetect",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "torch",
  "tqdm",
  "transformers",
  "textattack",
]

[tool.setuptools.packages.find]
where = ["src"]

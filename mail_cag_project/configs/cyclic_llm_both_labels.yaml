name: model_c_llm_both_labels
description: Model C - cyclic ALBERT trained with LLM rewrites for both phishing and benign emails.

research_question: >
  Does rewriting both phishing and benign examples reduce LLM-style artifacts
  and improve robustness compared with phishing-only LLM cyclic training?

data:
  raw_path: ../../data/processed/CEAS_08_en_1600.csv
  sample_frac_per_label: 0.06
  validation_seed_path: ../../validation_set_0.csv
  random_seed: 42

model:
  base_model: albert-base-v2
  max_length: 512
  num_labels: 2

training:
  rounds: 3
  learning_rate: 5.0e-5
  num_train_epochs: 3
  train_batch_size: 16
  eval_batch_size: 16
  strategy: cyclic_llm_budgeted
  orig_samples_per_round: null

attacks:
  training_attackers:
    - llm_rewrite
  rewrite_scope: both_labels
  target_labels:
    - 0
    - 1
  candidates_per_email: 1
  max_examples_per_round: 200
  min_confidence_drop_to_add: 0.0
  save_every_rewrites: 50
  selection_rule: lowest_true_label_confidence

llm:
  provider: ollama
  model: qwen3:8b
  fallback_models:
    - qwen3:14b
    - qwen3:4b
  temperature: 0.6
  top_p: 0.9
  keep_alive: "0"

evaluation:
  clean_test: true
  textattack_attackers:
    - textfooler
    - pwws
    - deepwordbug
  llm_held_out: true

paths:
  run_root: ../../runs/model_c_llm_both_labels

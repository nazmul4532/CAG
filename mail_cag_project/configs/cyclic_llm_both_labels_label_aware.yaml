name: model_d_llm_both_labels_label_aware
description: Model D - cyclic ALBERT trained with balanced, label-aware LLM rewrites for both phishing and benign emails.

research_question: >
  Does balanced, label-aware rewriting of both phishing and benign examples
  improve robustness without making the classifier over-predict phishing?

data:
  raw_path: ../../data/processed/CEAS_08_en_1600.csv
  sample_frac_per_label: 0.06
  validation_seed_path: ../../validation_set_0.csv
  random_seed: 42

model:
  base_model: albert-base-v2
  max_length: 512
  num_labels: 2

training:
  rounds: 4
  learning_rate: 5.0e-5
  num_train_epochs: 3
  train_batch_size: 16
  eval_batch_size: 16
  strategy: cyclic_llm_budgeted
  orig_samples_per_round: null

attacks:
  training_attackers:
    - llm_rewrite
  rewrite_scope: both_labels_label_aware
  target_labels:
    - 0
    - 1
  candidates_per_email: 1
  rewrite_selection_rule: balanced_random
  max_examples_per_round: null
  max_examples_per_label_per_round: 750
  min_confidence_drop_to_add: 0.0
  save_every_rewrites: 50

llm:
  provider: ollama
  model: qwen3:8b
  prompt_style: label_aware_v2
  cache_enabled: true
  fallback_models:
    - qwen3:14b
    - qwen3:4b
  temperature: 0.6
  top_p: 0.9
  keep_alive: "0"

evaluation:
  clean_test: true
  textattack_attackers:
    - textfooler
    - pwws
    - deepwordbug
  llm_held_out: true

paths:
  run_root: ../../runs/model_d_llm_both_labels_label_aware
  rewrite_cache: ../../data/cache/model_d_label_aware_v2_llm_rewrite_cache.csv

name: approach_v4_cumulative
description: Cumulative cyclic game that carries previous adversarial examples forward.

data:
  raw_path: ../../legacy_workspace/artifacts/data/raw/CEAS_08.csv
  sample_frac_per_label: 0.06
  validation_seed_path: ../../validation_set_0.csv
  random_seed: 42

model:
  base_model: albert-base-v2
  max_length: 256
  num_labels: 2

training:
  rounds: 4
  learning_rate: 5.0e-5
  num_train_epochs: 3
  train_batch_size: 16
  eval_batch_size: 16
  strategy: cumulative_replay

attacks:
  training_attackers:
    - textfooler
    - pwws
    - deepwordbug
  max_examples_per_round: null
  timeout_seconds_per_sample: 60

evaluation:
  clean_test: true
  seen_attackers:
    - textfooler
    - pwws
    - deepwordbug
  held_out_attackers: []

paths:
  legacy_output_dir: ../../legacy_workspace/artifacts/outputs/experiments/albert_adversarial_game_model_v4
  legacy_validation_dir: ../../legacy_workspace/artifacts/outputs/experiments/albert_adversarial_val_sets_v4 copy
  run_root: runs/approach_v4_cumulative
